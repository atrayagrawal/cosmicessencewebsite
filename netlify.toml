[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/programs/founders-blueprint.html"
  to = "/programs/future-founders-bootcamp.html"
  status = 301

[[redirects]]
  from = "/atlas"
  to = "/atlas.html"
  status = 200

[[redirects]]
  from = "/programs/math-classes"
  to = "https://wa.me/918742017911?text=Hi%20Atray%2C%20I'm%20interested%20in%20Math%20classes%20for%20IB/IGCSE."
  status = 302

[[redirects]]
  from = "/programs/math-classes.html"
  to = "https://wa.me/918742017911?text=Hi%20Atray%2C%20I'm%20interested%20in%20Math%20classes%20for%20IB/IGCSE."
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
